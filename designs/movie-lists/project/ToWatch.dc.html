<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>To watch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#16140F}
a{color:#E8A33D}a:hover{color:#F2B85A}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #16140F; color: #F2EDE3; font-family: 'Instrument Sans', sans-serif; overflow: hidden">
<header style="padding: 64px 12px 12px 20px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: Fraunces, serif; font-size: 34px; font-weight: 600">To watch</h1>
<a href="Main.dc.html" aria-label="Log out" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A39B8C">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 16l-4-4 4-4"></path><path d="M6 12h10"></path></svg>
</a>
</header>
<ul style="margin: 0; padding: 0; list-style: none; flex-grow: 1; overflow: hidden">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<li style="border-bottom: 1px solid #2A2721">
<a href="Movie.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 10px 20px; min-height: 72px; text-decoration: none; color: #F2EDE3">
<div style="width: 48px; height: 72px; flex-shrink: 0; border-radius: 4px; background: {{item.tone}}"></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">{{item.title}}</span>
<span style="font-size: 13px; color: #A39B8C">{{item.year}}</span>
</div>
</a>
</li>
</sc-for>
</ul>
<dc-import name="TabBar" active="toWatch" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { items: [
{ title: 'Aftersun', year: '2022', tone: '#26303A' },
{ title: 'Perfect Days', year: '2023', tone: '#2A3330' },
{ title: 'Anatomy of a Fall', year: '2023', tone: '#3A3326' },
{ title: 'The Zone of Interest', year: '2023', tone: '#33293A' },
{ title: 'Paterson', year: '2016', tone: '#3A2E26' },
] };
}
}
</script>
</body>
</html>
