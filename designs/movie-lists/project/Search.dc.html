<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#16140F}
a{color:#E8A33D}a:hover{color:#F2B85A}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #16140F; color: #F2EDE3; font-family: 'Instrument Sans', sans-serif; overflow: hidden">
<header style="padding: 64px 20px 16px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: Fraunces, serif; font-size: 34px; font-weight: 600">Search</h1>
<div style="position: relative">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search movies by title</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A39B8C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 14px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="q" type="search" value="before" placeholder="Movie title" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 16px 0 44px; border-radius: 12px; border: 1px solid #3A352C; background: #221F19; color: #F2EDE3; font-family: inherit; font-size: 16px">
</div>
</header>
<ul style="margin: 0; padding: 0; list-style: none; flex-grow: 1; overflow: hidden">
<sc-for list="{{items}}" as="item" hint-placeholder-count="6">
<li style="border-bottom: 1px solid #2A2721">
<a href="Movie.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 10px 20px; min-height: 72px; text-decoration: none; color: #F2EDE3">
<div style="width: 48px; height: 72px; flex-shrink: 0; border-radius: 4px; background: {{item.tone}}"></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">{{item.title}}</span>
<span style="font-size: 13px; color: #A39B8C">{{item.year}}</span>
</div>
</a>
</li>
</sc-for>
</ul>
<dc-import name="TabBar" active="search" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { items: [
{ title: 'Before Sunrise', year: '1995', tone: '#3A2E26' },
{ title: 'Before Sunset', year: '2004', tone: '#2A3330' },
{ title: 'Before Midnight', year: '2013', tone: '#33293A' },
{ title: 'Before I Go to Sleep', year: '2014', tone: '#3A3326' },
{ title: 'Before We Go', year: '2014', tone: '#26303A' },
{ title: 'Before the Devil Knows You’re Dead', year: '2007', tone: '#3A2626' },
] };
}
}
</script>
</body>
</html>
