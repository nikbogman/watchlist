<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movie page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#16140F}
a{color:#E8A33D}a:hover{color:#F2B85A}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #16140F; color: #F2EDE3; font-family: 'Instrument Sans', sans-serif; overflow: hidden">
<header style="padding: 52px 8px 0">
<a href="Requests.dc.html" aria-label="Back to Requests" style="display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 12px; text-decoration: none; color: #E8A33D; font-size: 16px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
<span>Requests</span>
</a>
</header>
<main style="flex-grow: 1; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; gap: 18px; align-items: flex-end">
<div style="width: 140px; height: 210px; flex-shrink: 0; border-radius: 8px; background: #3A2E26; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #A39B8C">[POSTER]</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px">
<h1 style="margin: 0; font-family: Fraunces, serif; font-size: 30px; font-weight: 600; line-height: 1.1">Before Sunrise</h1>
<span style="font-size: 15px; color: #A39B8C">1995</span>
<span style="font-size: 13px; font-weight: 600; color: {{statusColor}}">{{statusText}}</span>
</div>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #D6CFC2">A young man and woman meet on a train in Europe, and wind up spending one evening together in Vienna. Unfortunately, both know that this will probably be their only night together.</p>
<a href="https://www.instagram.com/" style="align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 22px; background: #221F19; text-decoration: none; font-size: 13px; font-weight: 500; color: #A39B8C">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2.5-8h11L20 13v6H4z"></path><path d="M4 13h4.5l1 2.5h5l1-2.5H20"></path></svg>
<span>Found in a reel you shared</span>
<span style="color: #E8A33D; font-weight: 600">Open reel</span>
</a>
<div role="group" aria-label="Track this movie" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: auto; margin-bottom: 20px">
<button type="button" aria-pressed="{{b.toWatch.pressed}}" onClick="{{pressToWatch}}" style="height: 64px; border-radius: 12px; border: 1px solid {{b.toWatch.border}}; background: {{b.toWatch.bg}}; color: {{b.toWatch.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg>
<span>To watch</span>
</button>
<button type="button" aria-pressed="{{b.watched.pressed}}" onClick="{{pressWatched}}" style="height: 64px; border-radius: 12px; border: 1px solid {{b.watched.border}}; background: {{b.watched.bg}}; color: {{b.watched.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>
<span>Watched</span>
</button>
<button type="button" aria-pressed="{{b.favourite.pressed}}" onClick="{{pressFavourite}}" style="height: 64px; border-radius: 12px; border: 1px solid {{b.favourite.border}}; background: {{b.favourite.bg}}; color: {{b.favourite.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
<span>Favourite</span>
</button>
</div>
</main>
<dc-import name="TabBar" active="requests" busy="{{ true }}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { status: null, favourite: false };
}
renderVals() {
const s = this.state;
const today = '4 Oct 2026';
const style = (on) => on
? { pressed: 'true', bg: '#E8A33D', fg: '#16140F', border: '#E8A33D' }
: { pressed: 'false', bg: 'transparent', fg: '#F2EDE3', border: '#4A443A' };
let statusText = 'Not in your lists', statusColor = '#A39B8C';
if (s.status === 'to_watch') { statusText = 'On To watch'; statusColor = '#E8A33D'; }
if (s.status === 'watched') { statusText = 'Watched on ' + today; statusColor = '#E8A33D'; }
return {
statusText, statusColor,
b: {
toWatch: style(s.status === 'to_watch'),
watched: style(s.status === 'watched'),
favourite: style(s.favourite),
},
pressToWatch: () => this.setState(s.status === 'to_watch'
? { status: null, favourite: false }
: { status: 'to_watch', favourite: false }),
pressWatched: () => this.setState(s.status === 'watched'
? { status: null, favourite: false }
: { status: 'watched', favourite: false }),
pressFavourite: () => this.setState(s.status === 'watched'
? { favourite: !s.favourite }
: { status: 'watched', favourite: true }),
};
}
}
</script>
</body>
</html>
